<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>String Art 3D Visualizer</title>

  <!-- No bundler in this repo (see package.json) - Three.js loaded straight
       from a version-pinned CDN build via an import map, the same "pin an
       exact version" convention as p5.js's own CDN <script> tag. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="../src/three-page/bootstrap.js"></script>

  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/colors.css">
  <link rel="stylesheet" href="../css/customPalette.css">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/three-page.css">
</head>

<body>
  <div class="page-nav">
    <a href="../" class="page-nav-link">
      <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="15,5 8,12 15,19" />
      </svg>
      Grid
    </a>
    <a href="../freestyle/" class="page-nav-link">Freestyle</a>
  </div>

  <!-- Burger: shows the toolbar when it's hidden. Exactly one of #burger /
       #closeUiBtn is ever visible at a time (see MenuUI.js, unchanged) - the
       toolbar starts open, so this starts hidden. Both sit at the same
       fixed top-left anchor (styles.css), so one swaps cleanly for the other. -->
  <div id="burger" class="hidden" role="button" tabindex="0" aria-label="Show toolbar">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
      aria-hidden="true">
      <line x1="4" y1="6" x2="20" y2="6" />
      <line x1="4" y1="12" x2="20" y2="12" />
      <line x1="4" y1="18" x2="20" y2="18" />
    </svg>
  </div>

  <!-- Top toolbar. Visible by default (paint-app convention: tools stay on
       screen); #closeUiBtn hides it and hands off to #burger above. -->
  <div id="ui" class="panel">
    <button id="closeUiBtn" class="panel-close-btn" title="Hide Toolbar" aria-label="Hide Toolbar">
      <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" aria-hidden="true">
        <line x1="6" y1="6" x2="18" y2="18" />
        <line x1="18" y1="6" x2="6" y2="18" />
      </svg>
    </button>

    <!-- Grid Size - a preset dropdown (applies immediately) plus a custom
         field cover any N. Grid Shape (Triangle/Square/Hexagon - see
         GridSizeUI.js/gridShape.js) lives here too since size and shape are
         always applied together; Triangle/Hexagon are the rectangular N x N
         lattice this page has always had (Hexagon is Triangle with 1 of its
         3 sublattices removed - a true honeycomb), Square rings N nails
         per edge. -->
    <div class="toolbar-group">
      <button id="openGridSizeBtn" class="toolbar-btn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="8" height="8" rx="1.5" />
          <rect x="13" y="3" width="8" height="8" rx="1.5" />
          <rect x="3" y="13" width="8" height="8" rx="1.5" />
          <rect x="13" y="13" width="8" height="8" rx="1.5" />
        </svg>
        <span class="toolbar-btn-label">Grid</span>
        <svg class="icon icon--sm chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="9,5 16,12 9,19" />
        </svg>
      </button>
      <div id="gridSizeSubmenu" class="panel hidden">
        <button id="closeGridSizeSubmenuBtn" class="panel-close-btn" aria-label="Close">
          <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" aria-hidden="true">
            <line x1="6" y1="6" x2="18" y2="18" />
            <line x1="18" y1="6" x2="6" y2="18" />
          </svg>
        </button>
        <div class="section-title">Grid Size</div>

        <select id="gridShapeSelect"></select>
        <select id="gridSizePreset"></select>

        <input id="gridSizeCustomInput" type="number" min="3" max="41" step="1" placeholder="e.g. 13" />
        <button id="applyGridSizeBtn" class="menu-btn menu-btn--primary">Apply</button>
      </div>
    </div>

    <!-- Board thickness/color - the physical board mesh's configurable
         properties. No open/close toggle existed for this group before (it
         sat inline in the sidebar) - wrapping it in the same Panel pattern
         every other group already uses is the one bit of new (additive
         only) wiring this pass needed in ThreeApp.js. -->
    <div class="toolbar-group">
      <button id="openBoardBtn" class="toolbar-btn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="6" width="18" height="12" rx="2" />
          <line x1="3" y1="12" x2="21" y2="12" />
        </svg>
        <span class="toolbar-btn-label">Board</span>
        <svg class="icon icon--sm chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="9,5 16,12 9,19" />
        </svg>
      </button>
      <div id="boardSubmenu" class="panel hidden">
        <button id="closeBoardSubmenuBtn" class="panel-close-btn" aria-label="Close">
          <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" aria-hidden="true">
            <line x1="6" y1="6" x2="18" y2="18" />
            <line x1="18" y1="6" x2="6" y2="18" />
          </svg>
        </button>
        <div class="section-title">Board</div>
        <div class="field-row">
          <label for="boardThicknessInput" class="field-label">Thickness</label>
          <input id="boardThicknessInput" type="number" min="1" max="200" step="1" />
          <button id="applyBoardThicknessBtn" class="menu-btn menu-btn--primary">Apply</button>
        </div>
        <div class="field-row">
          <label for="boardColorInput" class="field-label">Color</label>
          <input id="boardColorInput" type="color" />
        </div>
      </div>
    </div>

    <!-- Nail height (global Z control) + "Show Inner Nails" - same new
         Panel-wrapping treatment as Board, for the same reason. -->
    <div class="toolbar-group">
      <button id="openNailsBtn" class="toolbar-btn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="7" r="4" />
          <line x1="12" y1="11" x2="12" y2="21" />
        </svg>
        <span class="toolbar-btn-label">Nails</span>
        <svg class="icon icon--sm chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="9,5 16,12 9,19" />
        </svg>
      </button>
      <div id="nailsSubmenu" class="panel hidden">
        <button id="closeNailsSubmenuBtn" class="panel-close-btn" aria-label="Close">
          <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" aria-hidden="true">
            <line x1="6" y1="6" x2="18" y2="18" />
            <line x1="18" y1="6" x2="6" y2="18" />
          </svg>
        </button>
        <div class="section-title">Nails</div>
        <div class="field-row">
          <label for="nailHeightInput" class="field-label">Height</label>
          <input id="nailHeightInput" type="number" min="1" max="300" step="1" />
          <button id="applyNailHeightBtn" class="menu-btn menu-btn--primary">Apply</button>
        </div>
        <label class="switch-row">
          <span class="field-label">Show Inner Nails</span>
          <span class="switch">
            <input id="innerNailsToggle" type="checkbox" checked />
            <span class="switch-track"></span>
          </span>
        </label>
      </div>
    </div>

    <!-- Deformation (Puppet Warp) - same shared DeformationUI the 2D grid
         page uses. Pin interactions (Ctrl+Click/Drag/Alt+Click) only work
         while Drawing Mode is ON, since that's the only time clicks raycast
         onto the board/nail plane at all - see ThreeApp's #handleDeformationClick. -->
    <div class="toolbar-group">
      <button id="openDeformationBtn" class="toolbar-btn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="3,14 7,7 11,18 15,7 19,14 21,11" />
        </svg>
        <span class="toolbar-btn-label">Deform</span>
        <svg class="icon icon--sm chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="9,5 16,12 9,19" />
        </svg>
      </button>
      <div id="deformationSubmenu" class="panel hidden">
        <button id="closeDeformationSubmenuBtn" class="panel-close-btn" aria-label="Close">
          <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" aria-hidden="true">
            <line x1="6" y1="6" x2="18" y2="18" />
            <line x1="18" y1="6" x2="6" y2="18" />
          </svg>
        </button>
        <div class="section-title">Grid Deformation</div>
        <p class="field-hint">
          In Drawing Mode: Ctrl+Click a nail: add pin &middot; Ctrl+Drag: move it &middot; Alt+Click: remove it
        </p>

        <div class="section-title section-title--sub">New pin defaults</div>
        <div class="field-row">
          <label for="deformationDefaultRadiusInput" class="field-label">Radius</label>
          <input id="deformationDefaultRadiusInput" type="number" min="1" step="1" />
        </div>
        <div class="field-row">
          <label for="deformationDefaultFalloffInput" class="field-label">Falloff</label>
          <input id="deformationDefaultFalloffInput" type="number" min="0.1" step="0.1" />
        </div>
        <button id="applyDeformationDefaultsBtn" class="menu-btn menu-btn--primary">Apply</button>

        <div class="section-title section-title--sub">Selected pin</div>
        <div class="field-row">
          <label for="deformationSelectedRadiusInput" class="field-label">Radius</label>
          <input id="deformationSelectedRadiusInput" type="number" min="1" step="1" />
        </div>
        <div class="field-row">
          <label for="deformationSelectedFalloffInput" class="field-label">Falloff</label>
          <input id="deformationSelectedFalloffInput" type="number" min="0.1" step="0.1" />
        </div>
        <button id="applyDeformationSelectedBtn" class="menu-btn menu-btn--primary">Apply</button>
        <button id="removeDeformationPinBtn" class="menu-btn">Remove Pin</button>

        <div id="deformationPinCount">0 pins</div>
        <button id="resetDeformationBtn" class="menu-btn">Reset Deformation</button>
      </div>
    </div>

    <div class="toolbar-divider"></div>

    <!-- Colors: swatch pickers, color count, stroke weight, Default/Custom
         mode toggle. Same new Panel-wrapping treatment as Board/Nails. -->
    <div class="toolbar-group">
      <button id="openColorsBtn" class="toolbar-btn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <circle cx="8" cy="9" r="1.4" fill="currentColor" stroke="none" />
          <circle cx="16" cy="9" r="1.4" fill="currentColor" stroke="none" />
          <circle cx="12" cy="16" r="1.4" fill="currentColor" stroke="none" />
        </svg>
        <span class="toolbar-btn-label">Colors</span>
        <svg class="icon icon--sm chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="9,5 16,12 9,19" />
        </svg>
      </button>
      <div id="colorsSubmenu" class="panel hidden">
        <button id="closeColorsSubmenuBtn" class="panel-close-btn" aria-label="Close">
          <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" aria-hidden="true">
            <line x1="6" y1="6" x2="18" y2="18" />
            <line x1="18" y1="6" x2="6" y2="18" />
          </svg>
        </button>
        <div class="section-title">Colors</div>

        <div class="field-row">
          <label for="colorCountInput" class="field-label">Colors</label>
          <input id="colorCountInput" type="number" min="1" max="25" step="1" />
          <button id="applyColorCountBtn" class="menu-btn menu-btn--primary">Apply</button>
        </div>

        <div class="field-row">
          <label for="strokeWeightInput" class="field-label">Stroke Weight</label>
          <input id="strokeWeightInput" type="number" min="0.1" max="30" step="0.1" />
          <button id="applyStrokeWeightBtn" class="menu-btn menu-btn--primary">Apply</button>
        </div>

        <!-- Default/Custom picker-mode toggle - see PickerModeUI.js -->
        <div id="colorPickerModeToggle">
          <button id="pickerModeDefaultBtn" class="menu-btn">Default</button>
          <button id="pickerModeCustomBtn" class="menu-btn">Custom</button>
        </div>

        <!-- Populated by ColorPickerUI from the palette (size set above) -->
        <div id="colorPickerContainer"></div>
      </div>
    </div>

    <!-- Curves - every committed curve in Z-layer order, with a show/hide
         checkbox each (src/ui/CurvesUI.js). -->
    <div class="toolbar-group">
      <button id="openCurvesBtn" class="toolbar-btn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="4" y1="7" x2="20" y2="7" />
          <line x1="6" y1="12" x2="18" y2="12" />
          <line x1="8" y1="17" x2="16" y2="17" />
        </svg>
        <span class="toolbar-btn-label">Curves</span>
        <svg class="icon icon--sm chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="9,5 16,12 9,19" />
        </svg>
      </button>
      <div id="curvesSubmenu" class="panel hidden">
        <button id="closeCurvesSubmenuBtn" class="panel-close-btn" aria-label="Close">
          <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" aria-hidden="true">
            <line x1="6" y1="6" x2="18" y2="18" />
            <line x1="18" y1="6" x2="6" y2="18" />
          </svg>
        </button>
        <div class="section-title">Curves</div>
        <ul id="curvesList" style="max-height: 200px; overflow-y: auto;"></ul>
      </div>
    </div>

    <!-- Colors Submenu (favorite bundle save/export/import/apply) - the
         exact shared FavoritesUI both p5 pages use. -->
    <div class="toolbar-group">
      <button id="openFavoritesBtn" class="toolbar-btn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="6,4 18,4 18,20 12,16 6,20" />
        </svg>
        <span class="toolbar-btn-label">Your Colors</span>
        <svg class="icon icon--sm chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="9,5 16,12 9,19" />
        </svg>
      </button>
      <div id="colorFavoritesSubmenu" class="panel hidden">
        <button id="closeColorSubmenuBtn" class="panel-close-btn" aria-label="Close">
          <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" aria-hidden="true">
            <line x1="6" y1="6" x2="18" y2="18" />
            <line x1="18" y1="6" x2="6" y2="18" />
          </svg>
        </button>
        <div class="section-title">Your Colors</div>
        <div id="favoriteBundlesContainer"></div>
        <button id="saveCurrentColorBtn" class="menu-btn menu-btn--primary">Save</button>
        <button id="exportColorsBtn" class="menu-btn">Export</button>
        <input type="file" id="importColorsInput" accept=".json,.txt" style="display:none;" />
        <button id="importColorsBtn" class="menu-btn">Import</button>
      </div>
    </div>

    <!-- Pattern Tools - the exact shared PatternUI/PatternStamper the 2D
         grid page uses (Manual/Auto toggle included). -->
    <div class="toolbar-group">
      <button id="openPatternBtn" class="toolbar-btn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="12,4 20,20 4,20" />
        </svg>
        <span class="toolbar-btn-label">Patterns</span>
        <svg class="icon icon--sm chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="9,5 16,12 9,19" />
        </svg>
      </button>
      <div id="patternSubmenu" class="panel hidden">
        <button id="closePatternSubmenuBtn" class="panel-close-btn" aria-label="Close">
          <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" aria-hidden="true">
            <line x1="6" y1="6" x2="18" y2="18" />
            <line x1="18" y1="6" x2="6" y2="18" />
          </svg>
        </button>
        <div class="section-title">Pattern Tools</div>

        <input id="patternNameInput" type="text" placeholder="name..." />
        <button id="saveCurrentPatternBtn" class="menu-btn menu-btn--primary">Save Current</button>

        <ul id="savedPatternsList" style="max-height: 150px; overflow-y: auto;"></ul>

        <button id="exportPatternBtn" class="menu-btn">Export Pattern</button>
        <input type="file" id="importPatternInput" accept=".json,.txt" style="display:none;" />
        <button id="importPatternBtn" class="menu-btn">Import Pattern</button>
        <div class="section-title section-title--sub">Pattern type</div>
        <button id="toggleBtn" class="menu-btn">Manual</button>
      </div>
    </div>

    <div class="toolbar-divider"></div>

    <!-- Direct one-click actions - no dropdown needed, matching a paint
         app's always-visible action icons. -->
    <button id="resetBtn" class="toolbar-btn menu-btn--primary" title="Commit current curve">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <polyline points="4,12 9,17 20,6" />
      </svg>
      <span class="toolbar-btn-label">Reset</span>
    </button>
    <button id="undoBtn" class="toolbar-btn" title="Undo">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <polyline points="10,6 4,12 10,18" />
        <line x1="4" y1="12" x2="20" y2="12" />
      </svg>
      <span class="toolbar-btn-label">Undo</span>
    </button>
    <button id="undoLineBtn" class="toolbar-btn" title="Undo Line">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <polyline points="10,6 4,12 10,18" />
        <line x1="4" y1="12" x2="17" y2="12" />
        <line x1="20" y1="7" x2="20" y2="17" />
      </svg>
      <span class="toolbar-btn-label">Undo Line</span>
    </button>
    <button id="clearAllBtn" class="toolbar-btn menu-btn--danger" title="Clear All Points">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <rect x="6" y="7" width="12" height="13" rx="1" />
        <line x1="4" y1="7" x2="20" y2="7" />
        <line x1="10" y1="11" x2="10" y2="17" />
        <line x1="14" y1="11" x2="14" y2="17" />
        <line x1="9" y1="7" x2="9" y2="4" />
        <line x1="15" y1="7" x2="15" y2="4" />
        <line x1="9" y1="4" x2="15" y2="4" />
      </svg>
      <span class="toolbar-btn-label">Clear All Points</span>
    </button>
    <button id="resetCameraBtn" class="toolbar-btn" title="Reset Camera">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="8" width="18" height="12" rx="2" />
        <rect x="9" y="4" width="6" height="4" rx="1" />
        <circle cx="12" cy="14" r="3.5" />
      </svg>
      <span class="toolbar-btn-label">Reset Camera</span>
    </button>

    <!-- Drawing Mode - ON locks the camera to an exact top-down orthographic
         view (no orbit/pan/zoom) and lets clicks select nails/build curves,
         same as the 2D grid tool's manual curve-building flow. OFF returns
         to free perspective inspection, restoring the exact camera
         viewpoint from before Drawing Mode was entered. -->
    <label class="toolbar-switch" title="Drawing Mode">
      <span class="switch">
        <input id="drawingModeToggle" type="checkbox" />
        <span class="switch-track"></span>
      </span>
      Drawing Mode
    </label>

    <div class="toolbar-spacer"></div>

    <!-- Light/dark toggle - ThemeToggle.js only ever flips `data-theme` on
         <html>; every color on this page already reads from tokens that key
         off that attribute (see three-page.css). -->
    <button id="themeToggleBtn" type="button" class="toolbar-btn theme-toggle-btn"
      aria-label="Toggle light/dark theme">
      <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4" />
        <line x1="12" y1="2" x2="12" y2="5" />
        <line x1="12" y1="19" x2="12" y2="22" />
        <line x1="2" y1="12" x2="5" y2="12" />
        <line x1="19" y1="12" x2="22" y2="12" />
        <line x1="4.6" y1="4.6" x2="6.7" y2="6.7" />
        <line x1="17.3" y1="17.3" x2="19.4" y2="19.4" />
        <line x1="4.6" y1="19.4" x2="6.7" y2="17.3" />
        <line x1="17.3" y1="6.7" x2="19.4" y2="4.6" />
      </svg>
